name: Build LunarisDolby APK

on:
  push:
    branches: [ "derp" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LunarisDolby
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install AOSP Hidden API android.jar
        run: |
          mkdir -p "$ANDROID_HOME/platforms/android-35"
          curl -fSL "https://github.com/Reginer/aosp-android-jar/raw/main/android-35/android.jar" \
            -o "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Generate Signing Key
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias lunaris -storepass password123 -keypass password123 \
            -dname "CN=LunarisDolby, OU=Port, O=Sweet, L=BA, S=BA, C=AR"

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunarisDolby-APK
          path: LunarisDolby/build/outputs/apk/release/*.apk
